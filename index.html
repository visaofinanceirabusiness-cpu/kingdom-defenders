<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kingdom Defenders — Fase 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game-wrap">

  <div class="map-select" id="mapSelect">
    <h1>Kingdom Defenders</h1>
    <p class="map-select__hint">Elegí un mapa para defender</p>
    <div class="map-select__grid" id="mapGrid"></div>
  </div>

  <div class="hud-top">
    <div class="hud-stat castle-block">
      <span class="icon">❤️</span>
      <span id="hudCastleHp">100 / 100</span>
      <div class="castle-hpbar"><div class="castle-hpbar__fill" id="hudCastleBar" style="width:100%"></div></div>
    </div>
    <div class="hud-stat"><span class="icon">💰</span><span id="hudGold">150</span></div>
    <div class="hud-stat"><span class="icon">🌊</span> Oleada <span id="hudWave">1 / 1</span></div>
    <div class="hud-stat player-block">
      <span class="icon">⭐</span>
      <span id="hudPlayerLevel">Nivel 1</span>
      <div class="xp-bar"><div class="xp-bar__fill" id="hudXpBar" style="width:0%"></div></div>
    </div>
    <button class="btn btn--sm" id="changeMapBtn">Cambiar mapa</button>
  </div>

  <div class="countdown" id="hudCountdown"></div>

  <canvas id="gameCanvas" width="960" height="540"></canvas>

  <div class="tower-panel hidden" id="towerPanel">
    <div class="tower-panel__head">
      <strong id="towerPanelName"></strong>
      <button class="tower-panel__close" id="towerPanelClose" aria-label="Cerrar">✕</button>
    </div>
    <div id="towerPanelLevel" class="tower-panel__level"></div>
    <div id="towerPanelStats" class="tower-panel__stats"></div>
    <div class="tower-panel__actions">
      <button class="btn" id="towerPanelUpgradeBtn">Mejorar</button>
      <button class="btn btn--danger" id="towerPanelSellBtn">Vender</button>
    </div>
  </div>

  <div class="hud-bottom">
    <div class="tower-picker" id="towerPicker"></div>
    <div class="abilities-bar" id="abilityPicker"></div>
    <div class="hud-message" id="hudMessage"></div>
    <button class="btn" id="startWaveBtn">Iniciar oleada</button>
  </div>

  <div class="end-screen hidden" id="endScreen">
    <h1 class="end-title" id="endTitle">VICTORIA</h1>
    <div class="end-stats" id="endStats"></div>
    <div class="end-actions">
      <button class="btn" id="retryBtn">Intentar nuevamente</button>
    </div>
  </div>

</div>

<script src="config.js"></script>
<script src="entities.js"></script>
<script src="game.js"></script>
<script>
  const canvas = document.getElementById("gameCanvas");
  const hud = {
    castleHp: document.getElementById("hudCastleHp"),
    castleBar: document.getElementById("hudCastleBar"),
    gold: document.getElementById("hudGold"),
    wave: document.getElementById("hudWave"),
    message: document.getElementById("hudMessage"),
    countdown: document.getElementById("hudCountdown"),
    startWaveBtn: document.getElementById("startWaveBtn"),
    endScreen: document.getElementById("endScreen"),
    endTitle: document.getElementById("endTitle"),
    endStats: document.getElementById("endStats"),
    towerPanel: document.getElementById("towerPanel"),
    towerPanelName: document.getElementById("towerPanelName"),
    towerPanelLevel: document.getElementById("towerPanelLevel"),
    towerPanelStats: document.getElementById("towerPanelStats"),
    towerPanelUpgradeBtn: document.getElementById("towerPanelUpgradeBtn"),
    towerPanelSellBtn: document.getElementById("towerPanelSellBtn"),
    playerLevel: document.getElementById("hudPlayerLevel"),
    xpBar: document.getElementById("hudXpBar")
  };

  let game = null;

  function beginGame(mapId) {
    document.getElementById("mapSelect").classList.add("hidden");
    document.getElementById("endScreen").classList.add("hidden");
    if (game) game.running = false; // corta el loop anterior antes de reemplazarlo
    game = new Game(canvas, hud, mapId);
    game.start();
  }

  document.getElementById("startWaveBtn").addEventListener("click", () => game && game.startWave());
  document.getElementById("retryBtn").addEventListener("click", () => game && game.restart());
  document.getElementById("towerPanelUpgradeBtn").addEventListener("click", () => game && game.upgradeSelectedTower());
  document.getElementById("towerPanelSellBtn").addEventListener("click", () => game && game.sellSelectedTower());
  document.getElementById("towerPanelClose").addEventListener("click", () => game && game._deselectTower());
  document.getElementById("changeMapBtn").addEventListener("click", () => {
    document.getElementById("mapSelect").classList.remove("hidden");
  });

  // Tarjetas de mapa generadas dinámicamente desde MAPS (config.js):
  // agregar un mapa nuevo en config.js la suma acá sin tocar este archivo.
  const mapGrid = document.getElementById("mapGrid");
  Object.values(MAPS).forEach((mapDef) => {
    const btn = document.createElement("button");
    btn.className = "map-card";
    btn.innerHTML = `<strong>${mapDef.name}</strong>`;
    btn.style.setProperty("--map-color", mapDef.terrainColors.top);
    btn.addEventListener("click", () => beginGame(mapDef.id));
    mapGrid.appendChild(btn);
  });

  // Botones de torre generados dinámicamente desde TOWER_TYPES (config.js):
  // agregar una torre nueva en config.js la suma acá sin tocar este archivo.
  const towerPicker = document.getElementById("towerPicker");
  const towerButtons = [];
  Object.values(TOWER_TYPES).forEach((def, index) => {
    const btn = document.createElement("button");
    btn.className = "tower-btn" + (index === 0 ? " is-active" : "");
    btn.title = def.name;
    btn.innerHTML = `${def.icon}<span class="cost">${def.levels[0].cost}</span>`;
    btn.addEventListener("click", () => {
      game.selectedTowerType = def.id;
      towerButtons.forEach((b) => b.classList.toggle("is-active", b === btn));
    });
    towerPicker.appendChild(btn);
    towerButtons.push(btn);
  });
  hud.towerButtons = towerButtons;

  // Botones de habilidad generados dinámicamente desde ABILITY_TYPES (config.js):
  // agregar una habilidad nueva en config.js la suma acá sin tocar este archivo.
  const abilityPicker = document.getElementById("abilityPicker");
  const abilityButtons = {};
  Object.values(ABILITY_TYPES).forEach((def) => {
    const btn = document.createElement("button");
    btn.className = "ability-btn";
    btn.title = `${def.name} — ${def.description}`;
    btn.innerHTML = `${def.icon}<span class="ability-cd hidden"></span>`;
    btn.addEventListener("click", () => game.useAbility(def.id));
    abilityPicker.appendChild(btn);
    abilityButtons[def.id] = { button: btn, cooldownEl: btn.querySelector(".ability-cd") };
  });
  hud.abilityButtons = abilityButtons;
</script>

</body>
</html>
